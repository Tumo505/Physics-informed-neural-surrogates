[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lv-surrogate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "torch", "scipy", "matplotlib", "h5py", "pyyaml"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
